# .sgd/test-map.yml — per-repo path mapping for the TDD test-evidence gate
# (.github/workflows/require-test-evidence.yml + the tdd-guard in-session
# hook). Scaffolded by /sgd:sgd-init — tailor the globs to this repo's actual
# layout before relying on it; delete any language section that doesn't apply.
#
# Classifies changed/edited files as production / test / exempt so the gate
# can require every production-path change to be accompanied by a test-path
# change in the same diff (or session). Classification precedence:
# exempt_paths first, then test_paths, then production_paths — a file
# matching none of the three counts as neither and never affects the
# decision (safe default for anything you haven't classified yet).
#
# Format is a CONSTRAINED YAML SUBSET, parsed by a dependency-free awk/grep
# extractor (no yq/python required):
#   - one scalar `mode:` line (advisory | blocking — always start advisory,
#     per SGD doctrine: prove the signal is clean before making it a gate)
#   - three top-level list keys (production_paths / test_paths / exempt_paths)
#   - each list item on its own `  - 'glob'` line — no nesting, no flow style
# Globs use bash globstar syntax (`**` matches zero or more directories).
#
# If this file is absent entirely, the gate and the hook both fall back to a
# built-in, generic multi-language default (roughly the union of the
# commented-out lists below) — so a repo gets *some* signal even before
# running /sgd:sgd-init. Uncomment and prune to the languages this repo
# actually uses for a materially better (fewer false positives/negatives)
# signal than the generic fallback.

mode: advisory

production_paths:
  # TypeScript / JavaScript
  # - 'src/**/*.ts'
  # - 'src/**/*.tsx'
  # - 'src/**/*.js'
  # - 'src/**/*.jsx'
  # Python
  # - '**/*.py'
  # Go
  # - '**/*.go'
  # Java / C# / Ruby
  # - '**/*.java'
  # - '**/*.cs'
  # - '**/*.rb'
  # Schema / SQL / migrations (language-agnostic — a data-layer change is a
  # production change too, and must carry test evidence; a SQL-only or
  # migration-only diff otherwise classifies as neither and slips the gate
  # entirely, issue #1060). These same three globs are already in the gate's
  # built-in fallback, so an UNTAILORED repo gets them for free; uncomment
  # here ONLY once you also uncomment your language rows above — a non-empty
  # production_paths list disables the built-in fallback wholesale, so a
  # partial list would silently drop coverage for the languages you omit.
  # - '**/*.sql'
  # - '**/*.psql'
  # - '**/migrations/**'

test_paths:
  # TypeScript / JavaScript (Jest/Vitest/Mocha conventions)
  # - 'src/**/*.test.ts'
  # - 'src/**/*.test.tsx'
  # - 'src/**/*.spec.ts'
  # - 'src/**/*.spec.tsx'
  # - '**/__tests__/**'
  # - 'test/**'
  # - 'tests/**'
  # Python (pytest conventions)
  # - '**/test_*.py'
  # - '**/*_test.py'
  # Go
  # - '**/*_test.go'
  # Java / C#
  # - '**/*Test.java'
  # - '**/*Tests.cs'

exempt_paths:
  - '**/*.md'
  - 'docs/**'
  - '.github/**'
  - '.sgd/**'
  - '**/*.json'
  - '**/*.yml'
  - '**/*.yaml'
  - '**/*.lock'
