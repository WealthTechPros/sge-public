# .sge/posture.yaml — per-repo review-independence posture declaration.
# Scaffolded by /sge:sge-init for solo-developer repos — tailor the
# reviewer_identity field before relying on it; provisioning the identity
# itself is a separate step (see docs/reviewer-identity-provisioning.md).
#
# When profile: solo and review_independence: declared-exception are set,
# the SGE independence gate (.github/scripts/check-review-independence.sh)
# accepts a verdict: pass sge-verdict block posted by the identity named in
# reviewer_identity — subject to ALL existing integrity checks that apply to
# any reviewer (SHA-binding to PR_HEAD_SHA, non-DISMISSED, unambiguous
# single fence, etc.).  The declared identity is explicitly exempted from
# the exclusion-set check that would otherwise exclude any identity that
# also committed on the branch.
#
# This is a versioned, PR-reviewable replacement for the opaque
# SGE_GOVERNANCE_PROFILE=solo / SGD_GOVERNANCE_PROFILE=solo repo-variable
# bypass — "declared, not silent" (sge#2219).  The old bypass is removed
# (or left as a legacy fallback) once S1 of sge#2219 lands.
#
# Schema
# ------
# profile            (required) solo | team
#                    solo  — one primary author; review independence is
#                            declared rather than structural.
#                    team  — normal multi-reviewer setup; omit or leave
#                            this file absent for the default gate behaviour.
#
# review_independence (required when profile: solo)
#                    declared-exception — the repo deliberately exempts the
#                    named reviewer_identity from the structural independence
#                    requirement.  Any other string is reserved for future
#                    posture variants.
#
# reviewer_identity  (required when profile: solo)
#                    The GitHub login of the dedicated non-committing reviewer
#                    identity.  This identity MUST NOT commit on any branch it
#                    reviews — committing enters it into the exclusion set and
#                    invalidates its own verdicts (sge#2288).
#
# enforcement        (optional, SPEC-128) onboarding | enforced
#                    onboarding — every SGE gate is advisory.  This is the
#                            default: an absent key means onboarding.
#                    enforced  — explicit opt-in; the gates listed in
#                            skills/sge-init/references/enforcement-profile.md
#                            block.  Promote only once the sge-init Step 9
#                            graduation criteria are met.
#                    Any other value is an error, never a silent onboarding.
#
# enforcement_exceptions (optional, SPEC-128) repo-level, dated gate
#                    exceptions.  A block list; each entry is ONE quoted line:
#                      - "<gate> | <reason> | <approver> | <YYYY-MM-DD expiry>"
#                    gate: commit-msg | tdd-guard | require-commit-trailer |
#                          require-test-evidence | branch-protection
#                    approver: the GitHub login that approved it.
#                    Commit-level overrides keep the SGE-Override: trailer.
#                    Read it with scripts/read-enforcement-profile.sh.
#
# Format: plain YAML — parsed by the reviewer-posture checks and
# scripts/read-enforcement-profile.sh using dependency-free awk/grep/bash
# (no yq or python required).  Keep to scalar values only; no nested
# mappings or flow sequences.  The sole exception is the
# enforcement_exceptions block list, whose entries are one-line quoted
# scalars so each stays one grep/awk-parseable line.
#
# AI proposes, human disposes — /sge:sge-init proposes this draft; a human
# reviews and writes it only after confirming the reviewer identity is
# provisioned and meets the non-committing constraint.

# profile: solo
# review_independence: declared-exception
# reviewer_identity: <github-login-of-dedicated-reviewer-bot>
# enforcement: onboarding
# enforcement_exceptions:
#   - "require-test-evidence | legacy importer has no harness yet | <approver-login> | 2026-12-31"
