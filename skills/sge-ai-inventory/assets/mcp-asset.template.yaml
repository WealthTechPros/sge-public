# MCP server / tool asset entry — minimal template for /sge:sge-ai-inventory add
# Copy this block into ai-inventory.yaml under mcp_assets[] and fill in the fields.
- id: MCP-XXX                       # replace with sequential id
  server_identity: ""
  description: ""
  status: proposed
  operator: unknown                  # wtp-operated | external | unknown
  exposure: unknown                  # network-reachable | internal-only | unknown
  auth_model: unknown                # oauth2 | mtls | api-key | none | unknown
  data_class_reachable:
    - unknown
  tools:
    - name: ""
      description: ""
      exposure: unknown
      data_class_reachable:
        - unknown
  risk:
    tier: unknown
    risk_score:
      computed: unknown              # populated by /sge:sge-ai-inventory add
      inputs:
        exposure: unknown
        auth_model: unknown
        data_class_reachable:
          - unknown
  control_bindings: []              # control ids from #450 catalogue
  evidence:
    approvals: []
